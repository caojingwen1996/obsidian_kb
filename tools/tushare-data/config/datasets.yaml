datasets:
  daily_info:
    api: daily_info
    purpose: 沪深股票每日市场统计，成交额、流通市值单位亿元
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [trade_date, ts_code, amount, float_mv]
  fund_daily:
    api: fund_daily
    purpose: ETF未复权日线；复权由共享MarketData层结合fund_adj计算
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]
  fund_adj:
    api: fund_adj
    purpose: 基金复权因子
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, adj_factor]
  index_daily:
    api: index_daily
    purpose: 国内指数日线；代码必须明确市场后缀
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]
  index_dailybasic:
    api: index_dailybasic
    purpose: Tushare指数每日估值；不等同其他指数商口径
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, total_mv, float_mv, total_share, float_share, free_share, turnover_rate, turnover_rate_f, pe, pe_ttm, pb]
  index_global:
    api: index_global
    purpose: 国际指数日线；SPX可用，不将IXIC替代NDX
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, swing, vol]
  shibor:
    api: shibor
    purpose: Shibor全期限利率，单位百分数
    required_params: []
    allowed_params: [date, start_date, end_date, fields]
    fields: [date, "on", 1w, 2w, 1m, 3m, 6m, 9m, 1y]
  stock_basic:
    api: stock_basic
    purpose: A股上市公司基础资料
    cache_ttl_seconds: 300
    required_params: []
    allowed_params: [ts_code, name, exchange, list_status, fields]
    fields: [ts_code, symbol, name, area, industry, market, exchange, list_date, list_status]
  daily:
    api: daily
    purpose: A股个股不复权历史日线行情
    adjustment: none
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]
  daily_basic:
    api: daily_basic
    purpose: A股估值、股息率、市值和交易活跃度
    dividend_yield_field: dv_ttm
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, close, turnover_rate, turnover_rate_f, volume_ratio, pe, pe_ttm, pb, ps_ttm, dv_ratio, dv_ttm, total_mv, circ_mv]
  moneyflow:
    api: moneyflow
    purpose: A股个股资金流向和大小单分档
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, buy_sm_vol, buy_sm_amount, sell_sm_vol, sell_sm_amount, buy_md_vol, buy_md_amount, sell_md_vol, sell_md_amount, buy_lg_vol, buy_lg_amount, sell_lg_vol, sell_lg_amount, buy_elg_vol, buy_elg_amount, sell_elg_vol, sell_elg_amount, net_mf_vol, net_mf_amount]
  margin_detail:
    api: margin_detail
    purpose: 沪深两市每日融资融券交易明细
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [trade_date, ts_code, name, rzye, rqye, rzmre, rqyl, rzche, rqchl, rqmcl, rzrqye]
  margin:
    api: margin
    purpose: 沪深市场融资融券交易汇总
    cache_ttl_seconds: 300
    required_params: []
    allowed_params: [trade_date, start_date, end_date, exchange_id, fields]
    fields: [trade_date, exchange_id, rzye, rzmre, rzche, rqye, rqmcl, rzrqye]
  us_tycr:
    api: us_tycr
    purpose: 美国每日国债收益率曲线
    cache_ttl_seconds: 300
    required_params: []
    allowed_params: [date, start_date, end_date, fields]
    fields: [date, m1, m2, m3, m6, y1, y2, y3, y5, y7, y10, y20, y30]
  fx_daily:
    api: fx_daily
    purpose: 外汇日线行情，用于美元指数、美元兑日元等外汇风险观察
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, trade_date, start_date, end_date, fields]
    fields: [ts_code, trade_date, bid_open, bid_close, bid_high, bid_low, ask_open, ask_close, ask_high, ask_low, tick_qty]
  income:
    api: income
    purpose: 利润表核心科目
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, ann_date, start_date, end_date, period, report_type, comp_type, fields]
  balancesheet:
    api: balancesheet
    purpose: 资产负债表核心科目
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, ann_date, start_date, end_date, period, report_type, comp_type, fields]
  cashflow:
    api: cashflow
    purpose: 现金流量表核心科目
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, ann_date, start_date, end_date, period, report_type, comp_type, fields]
  dividend:
    api: dividend
    purpose: 历史分红方案及实施记录
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, ann_date, record_date, ex_date, imp_ann_date, fields]
  stk_holdernumber:
    api: stk_holdernumber
    purpose: A股股东户数历史披露及相邻披露期变化
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, ann_date, enddate, start_date, end_date, fields]
    fields: [ts_code, ann_date, end_date, holder_num]
  top10_holders:
    api: top10_holders
    purpose: A股前十大股东披露名单，用于核验重要股东是否出现在定期报告口径中
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, period, ann_date, start_date, end_date, fields]
    fields: [ts_code, ann_date, end_date, holder_name, hold_amount, hold_ratio, hold_float_ratio, hold_change, holder_type]
  top10_floatholders:
    api: top10_floatholders
    purpose: A股前十大流通股东披露名单，用于核验重要流通股东是否出现在定期报告口径中
    cache_ttl_seconds: 300
    required_params: [ts_code]
    allowed_params: [ts_code, period, ann_date, start_date, end_date, fields]
    fields: [ts_code, ann_date, end_date, holder_name, hold_amount, hold_ratio, hold_float_ratio, hold_change, holder_type]
  index_weight:
    api: index_weight
    purpose: 指数历史成分股和权重
    cache_ttl_seconds: 300
    required_params: [index_code]
    allowed_params: [index_code, trade_date, start_date, end_date, fields]
    fields: [index_code, con_code, trade_date, weight]

  fund_basic:
    api: fund_basic
    required_params: []
    allowed_params: ["fields", "market"]
    fields: ["ts_code", "name", "fund_type", "list_date", "delist_date", "market"]
  ggt_daily:
    api: ggt_daily
    purpose: 港股通每日成交统计，金额沿用接口亿元单位，买卖笔数为万笔
    required_params: []
    allowed_params: [trade_date, start_date, end_date, fields]
    fields: [trade_date, buy_amount, buy_volume, sell_amount, sell_volume]
  fund_share:
    api: fund_share
    required_params: ["market", "trade_date"]
    allowed_params: ["fields", "market", "trade_date"]
    fields: ["ts_code", "trade_date", "fd_share"]
  fund_nav:
    api: fund_nav
    required_params: ["nav_date"]
    allowed_params: ["fields", "market", "nav_date"]
    fields: ["ts_code", "nav_date", "ann_date", "unit_nav", "adj_nav"]
  trade_cal:
    api: trade_cal
    required_params: ["end_date", "exchange", "start_date"]
    allowed_params: ["end_date", "exchange", "fields", "start_date"]
    fields: ["exchange", "cal_date", "is_open", "pretrade_date"]
