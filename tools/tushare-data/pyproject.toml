[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tushare-data"
version = "0.9.0"
description = "Shared Tushare client, daily market data services and stdio MCP server"
requires-python = ">=3.9"
dependencies = ["tushare"]

[project.scripts]
tushare-data-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["tushare_client", "tushare_market_data", "tushare_etf_flow", "mcp_server", "stock_data", "fund_data", "index_data", "financial_data"]
