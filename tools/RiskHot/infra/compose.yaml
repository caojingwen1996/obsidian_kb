name: riskhot
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: riskhot
      POSTGRES_PASSWORD: riskhot-local
      POSTGRES_DB: riskhot
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - riskhot-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riskhot -d riskhot']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  riskhot-pg:
