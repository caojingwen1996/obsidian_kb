name: riskhot-l0
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Run npm run init:env}
      POSTGRES_DB: riskhot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskhot"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.29.0
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Run npm run init:env}
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
    ports: ["127.0.0.1:7238:7233"]
    depends_on:
      postgres: { condition: service_healthy }
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: riskhot-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Run npm run init:env}
      KC_HOSTNAME: http://localhost:18080
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["identity-data:/opt/keycloak/data"]
volumes:
  postgres-data:
  identity-data:
