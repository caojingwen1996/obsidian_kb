<text x="944" y="274" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">PASS / UNKNOWN 继续</text>
<text x="944" y="309" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">BLOCK 阻断公开</text>
