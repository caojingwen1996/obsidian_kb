<text x="514" y="274" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">入库判重 · 正文提取</text>
<text x="514" y="309" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">清洗与元数据补齐</text>
