<path d="M 1136 1025 H 1719" stroke="#cd9642" stroke-width="6" stroke-linecap="round"/>
<text x="1144" y="1068" font-size="29" font-weight="700" fill="#18334e" text-anchor="start">周报／月报：从日报汇编</text>
<text x="1144" y="1109" font-size="25" font-weight="400" fill="#18334e" text-anchor="start">模型仅撰写总述与栏目导读</text>
<rect x="60" y="1250" width="1710" height="160" rx="15" fill="#eaf2fe" stroke="#ccddf3" stroke-width="2"/>
<text x="90" y="1295" font-size="32" font-weight="700" fill="#18334e" text-anchor="start">L7  统一公开与交付</text>
<text x="90" y="1343" font-size="27" font-weight="400" fill="#18334e" text-anchor="start">publication：公开范围 · 撤回 · 全文权限 · 代表报道</text>
<text x="90" y="1385" font-size="27" font-weight="600" fill="#18334e" text-anchor="start">网页  ·  RSS  ·  API  ·  MCP  ·  Agent Markdown</text>
<rect x="60" y="1450" width="1710" height="104" rx="15" fill="#f0f3f7" stroke="#dce3eb" stroke-width="2"/>
<text x="84" y="1490" font-size="27" font-weight="700" fill="#18334e" text-anchor="start">贯穿全流程的支撑</text>
<text x="84" y="1530" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">行业／站点配置  ·  任务调度  ·  回执复用  ·  预算熔断  ·  告警与恢复  ·  人工校正</text>
<text x="60" y="1605" font-size="21" font-weight="400" fill="#18334e" text-anchor="start">依据：KKKKhazix/AIHOT main 分支文档，2026-10-08；未逐行核验源码。完整来源见配套 Markdown。</text>
