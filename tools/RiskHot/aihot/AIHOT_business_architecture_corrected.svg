<text x="1004" y="624" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">候选召回 → 关系判断 → 信息增量评估</text>
<text x="1004" y="659" font-size="26" font-weight="400" fill="#18334e" text-anchor="start">事件关联／进展关系 + 精选资格确认</text>
