<path d="M 1086 770 H 1754" stroke="#8461b2" stroke-width="6" stroke-linecap="round"/>
<text x="1094" y="813" font-size="29" font-weight="700" fill="#18334e" text-anchor="start">L5  事件热度与综述</text>
<text x="1094" y="854" font-size="25" font-weight="400" fill="#18334e" text-anchor="start">独立参与方 · 时间衰减 · 事件综述</text>
<text x="1094" y="930" font-size="24" font-weight="600" fill="#18334e" text-anchor="start">产物：热点榜 · 事件页</text>
<rect x="60" y="790" width="370" height="410" rx="15" fill="#eef2f7" stroke="#dce4ef" stroke-width="2"/>
<text x="85" y="835" font-size="28" font-weight="700" fill="#18334e" text-anchor="start">关键边界</text>
<text x="85" y="880" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">hot_signal 仅作热度证据，</text>
<text x="85" y="916" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">不单独进入内容展示。</text>
<text x="85" y="988" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">普通文章仅有标题时，</text>
<text x="85" y="1024" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">等待材料补齐。</text>
<text x="85" y="1096" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">日报可补入符合规则的事件；</text>
<text x="85" y="1132" font-size="23" font-weight="400" fill="#18334e" text-anchor="start">取材同样遵守 publication。</text>
<text x="524" y="999" font-size="28" font-weight="700" fill="#18334e" text-anchor="start">L6  报告编排</text>
