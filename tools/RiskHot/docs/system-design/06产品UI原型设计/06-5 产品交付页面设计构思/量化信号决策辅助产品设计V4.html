function streak(s){
 if(['stale','first','missing'].includes(s.status))return 0;
 let n=0;for(let i=s.history.length-1;i>0;i--){if(s.history[i]!=null&&s.history[i-1]!=null&&s.history[i]>s.history[i-1])n++;else break;}return n;
}
function stateLabel(s,period='day'){

 if(s.status==='stale')return '观测过期 · 暂停判断';
 if(s.score==null)return '证据缺失 · 无法评分';
 const degree=s.score>=80?'高压':s.score>=60?'偏高':s.score>=40?'中等':'低位';
 if(s.status==='first')return degree+' · 首次观察';
 const d=diff(s,period);return degree+(d==null?' · 方向待判断':d>0?'增强':d<0?'缓解':'持平');
}
function position(s,past=false){

 const reason=s.status==='stale'?'观测已过期，不计算当前历史位置。':s.score==null?'关键证据缺失，暂无可比较分值。':prior.length<3?'历史样本不足，至少需 3 期可比观测；首次观察不推断历史位置。':null;
 if(reason)return `<section class="history-position"><h3>自身历史位置</h3><p class="muted">${reason}</p></section>`;
 const lo=Math.min(...prior),hi=Math.max(...prior),below=prior.filter(v=>v<s.score).length;
 const equal=prior.filter(v=>v===s.score).length;
 const label=s.score>hi?'高于此前全部观测':s.score<lo?'低于此前全部观测':s.score===hi?'处于此前观测上沿':s.score===lo?'处于此前观测下沿':'处于此前观测范围内';
 const start=past?'10.02':'10.09',end=past?'10.08':'10.15';
 return `<section class="history-position"><div class="history-title"><h3>自身历史位置</h3><span class="badge">短样本参照</span></div><small class="position-window">参照 ${start}–${end} · ${prior.length} 期</small><strong>${label}</strong><p>当前 ${s.score} 分，高于此前 ${prior.length} 期中的 ${below} 期${equal?`，与 ${equal} 期相同`:''}。</p><div class="position-scale" role="img" aria-label="0至100分刻度，此前观测范围${lo}至${hi}，当前${s.score}"><span class="prior-range" style="left:${lo}%;width:${Math.max(hi-lo,0.5)}%"></span><span class="current-mark" style="left:${s.score}%"></span></div><div class="scale-labels"><span>0</span><span>此前 ${lo}–${hi} 分 · 当前 ${s.score}</span><span>100</span></div><details><summary>比较窗口与计算口径</summary><p>2026.${start}–${end}，每日 18:00 北京时间，${prior.length} 期有效同口径示例观测，不包含当前期。按历史值严格低于当前值计数；相等单列，不将缺失补零。这里表示短期样本位置，不是长期分位、风险发生概率或未来预测。</p></details></section>`;
}

function method(){return `<details class="method"><summary>如何理解对象、分值与关联？</summary><p>对象围绕稳定风险问题、观察目标和范围建立，同一对象持续吸收事件。事件更新不必然改变评估；没有新事件也不等于风险稳定。“持续跟踪”是纳管状态，与压力程度分开。</p><p>0–100 为演示风险强度，不是发生概率。80 分为高压力演示分界。对象与风险源独立评估，不复制、不平均；排序以可比口径为前提，当前模型与阈值尚待校准。历史位置仅比较此前 7 期，不是长期分位。</p><p>同一对象可关联多个风险源，同一事件可支持多个对象；关联本身不证明因果。定义或范围变化导致不可比时，应中断历史比较。原型仅覆盖宏观对象，无需配置。</p></details>`;}
function sourcesOf(o,origin='home'){return `<div class="source-links">${o.sources.map(id=>`<a href="${sourceURL(id,origin,o.id)}">${signals.find(s=>s.id===id).name}${arrow()}</a>`).join('')}</div>`;}
function metrics(o){return `<div class="object-metrics"><strong class="${o.score>=80?'up':''}">${num(o.score)}<small> /100</small></strong><span class="${o.card?o.card.effect:tone(diff(o))}">${stateLabel(o)}<small>${o.card?(o.card.baseline?'数值较 '+o.card.baseline+' '+signed(diff(o))+' 分':'无比较基准'):('较前一日 '+signed(diff(o))+' 分')}</small></span></div>`;}
const effectInfo={pressure:['压力因素','up'],relief:['缓解因素','down'],uncertain:['作用待判断','warn']};
function variableValue(v){return `<span class="var-value">${v.current??'—'}<small>${v.unit}</small></span>`;}
function compactVariables(o){return `<div class="compact-variables">${o.card.variables.slice(0,2).map(v=>`<div><span><strong>${v.name}</strong><small>${v.meaning}</small></span><span>${variableValue(v)}<small class="${effectInfo[v.effect][1]}">${effectInfo[v.effect][0]}</small></span></div>`).join('')}</div>`;}
function variablesView(o){return `<section id="core-variables" class="card-section" tabindex="-1"><div class="section-heading"><h2>核心驱动变量</h2><span class="muted">本对象当期作用</span></div><p class="muted">先看观测怎样变，再看它对风险意味着什么。</p><div class="variables-list">${o.card.variables.map(v=>`<article class="variable-row" id="variable-${v.id}" data-variable="${v.id}" tabindex="-1"><div class="variable-heading"><div><h3>${v.name}</h3><span class="var-role">${v.role}</span> <span class="${effectInfo[v.effect][1]}">${effectInfo[v.effect][0]}</span></div><div class="variable-reading">${variableValue(v)}<small>前值 ${v.previous??'—'}${v.previous==null?'':' '+v.unit}</small></div></div><p>${v.meaning}</p>${v.date!==cutoffs[o.context]?`<p class="stale-label">观测截至 ${v.date} · 已过期，不作为当前作用结论</p>`:''}<details class="variable-evidence"><summary>观测依据与限制</summary><dl><div><dt>证据记录</dt><dd>${v.evidenceId} · v${v.version}</dd></div><div><dt>观测 / 可获得时间</dt><dd>${v.current==null?'暂无有效观测；缺口登记于':'均为'} 2026.${v.date} 18:00 北京时间</dd></div><div><dt>比较观测</dt><dd>${v.previous==null?'未提供可比前值':(o.context==='past'?'10.08':'10.15')+' 18:00 · '+v.previous+' '+v.unit}</dd></div><div><dt>适用限制</dt><dd>${v.limit}</dd></div></dl><p class="muted">DEMO-04 合成数据，无真实原文。作用是本对象当期的示例分析，不是变量的固定属性。</p></details></article>`).join('')}</div></section>`;}
function reasonView(o){return `<section id="change-reason" class="card-section" tabindex="-1"><h2>为什么变化</h2><p class="reason-lead">${o.card.reason}</p><p>${o.card.reasonDetail}</p><div class="reason-links"><span>对应变量</span>${o.card.refs.map(id=>`<button data-evidence="${id}">${o.card.variables.find(v=>v.id===id).name} ${arrow()}</button>`).join('')}</div><p class="reason-limit"><strong>保留的限制</strong>${o.card.limitation}</p><p class="muted">${o.card.baseline?'比较快照 '+o.card.baseline+' → '+cutoffs[o.context]+' · ':''}方向与原因来自本期演示评估，不由分差自动推导。${o.card.node?'减弱节点：'+o.card.node+'。':''}</p></section>`;}
function watchView(o){return `<section id="next-watch" class="card-section" tabindex="-1"><h2>下一步观察重点</h2><p class="muted">系统给出的验证条件，随评估更新，无需设置。</p><ol class="watch-list">${o.card.watch.map(w=>`<li><h3>${w.title}</h3><p>${w.signal}</p><dl class="watch-conditions"><div><dt class="up">强化条件</dt><dd>${w.stronger}</dd></div><div><dt class="down">缓解条件</dt><dd>${w.relief}</dd></div><div><dt>证据缺口</dt><dd>${w.gap}</dd></div></dl><small class="muted">关联变量：${w.variable}</small></li>`).join('')}</ol></section>`;}

function preview(o){return `<div class="panelhead"><h2>对象解读</h2><span class="badge">${o.tracking}</span></div><div class="aside-body"><h2>${o.name}</h2><p class="muted">${o.target} · ${o.scope}</p>${metrics(o)}<p class="takeaway">${o.card.reason}</p><h3>关键变量</h3>${compactVariables(o)}<div class="preview-watch"><h3>下一步先看</h3><strong>${o.card.watch[0].title}</strong><p>${o.card.watch[0].signal}</p></div><a class="button-link" href="${objectURL(o.id)}">查看变量、原因与观察重点 ${arrow()}</a><details class="preview-more"><summary>历史位置与关联来源</summary>${position(o)}${sourcesOf(o)}</details><a href="#object-list" class="back mobile-return" data-list>返回对象列表</a></div>`;}

function visibleObjects(){return objects.filter(o=>!sourceFilter||o.sources.includes(sourceFilter)).map(o=>objectAt(o.id)).sort((a,b)=>order==='recent'?b.admitted.localeCompare(a.admitted)||(b.score??-1)-(a.score??-1):(b.score??-1)-(a.score??-1));}
function overview(){nav(false);let list=visibleObjects();if(!list.some(o=>o.id===selectedObject))selectedObject=list[0]?.id;$('#main').innerHTML=`<div class="pagehead"><div><h1>风险速览</h1><p>看见具体压力，追溯判断如何形成。</p></div><div class="snapshot"><strong>2026.10.16 · 18:00 北京时间</strong>4 个风险观察对象 · 虚构演示</div></div><section class="important-changes"><div class="changes-head"><h2>本期重要变化</h2><span>相较 10.15 · 新纳入单列</span></div><div class="changes-list">${[['ust','压力增强','80 → 84 分 · 承接走弱'],['energy','出现缓解','80 → 77 分 · 库存回补'],['trade','新纳入观察','暂未评分 · 等待实际影响观测']].map(([id,label,copy])=>`<a class="change-item" href="${objectURL(id)}"><span class="${id==='ust'?'up':id==='energy'?'down':'muted'}">${label}</span><strong>${objects.find(o=>o.id===id).name}</strong><span class="muted">${copy}</span><span class="change-action">查看变化依据 ${arrow()}</span></a>`).join('')}</div></section><section class="source-background"><div><h2>风险源背景</h2><p>选择来源查看相关对象，或打开来源解读。</p></div><div class="source-filters"><button data-filter="" aria-pressed="${!sourceFilter}">全部对象</button>${signals.map(s=>`<div class="source-pair"><button data-filter="${s.id}" aria-pressed="${sourceFilter===s.id}">${s.name}<span>${objects.filter(o=>o.sources.includes(s.id)).length}</span></button><a href="${sourceURL(s.id)}" aria-label="查看${s.name}解读">${arrow()}</a></div>`).join('')}</div></section><div class="workspace"><section class="panel" id="object-list"><div class="panelhead"><div><h2>风险观察</h2><small>${list.length} 个对象${sourceFilter?' · '+signals.find(s=>s.id===sourceFilter).name:''}</small></div><div class="sorts"><button data-order="priority" aria-pressed="${order==='priority'}">按风险程度</button><button data-order="recent" aria-pressed="${order==='recent'}">新纳入优先</button></div></div><div class="object-list">${list.map(o=>`<button class="object-row ${selectedObject===o.id?'selected':''}" data-object="${o.id}" aria-pressed="${selectedObject===o.id}" aria-controls="object-preview"><span><strong>${o.name}</strong><small>${o.target} · ${o.scope}</small><span class="row-reason">${o.why}</span></span><span class="object-state"><strong class="${o.score>=80?'up':''}">${num(o.score)}<small>/100</small></strong><span class="${tone(diff(o))}">${o.score==null?'新纳入 · 暂未评分':stateLabel(o)}</span></span></button>`).join('')||'<div class="content"><h3>暂无关联的观察对象</h3><p>来源没有关联对象，不等于不存在风险。可返回全部对象继续阅读。</p><button data-filter="">查看全部对象</button></div>'}</div><p class="table-note">每个对象只出现一次。未评分不以零分替代；按风险程度时排在已评分对象之后。</p></section><aside class="panel aside" id="object-preview">${selectedObject?preview(objectAt(selectedObject)):'<div class="content"><h2>等待对象纳入</h2><p>暂不生成对象判断。</p></div>'}</aside></div>${method()}${footer()}`;}
function timeline(o){return `<ol class="timeline">${[...o.events].reverse().map(e=>`<li><div class="timeline-meta"><time>2026.${e[0]}</time><span class="badge ${e[1]==='评估更新'?'assessment':''}">${e[1]}</span></div><div><h3>${e[2]}</h3><p>${e[3]}</p><details><summary>查看${e[1]==='事件更新'?'事件依据':'记录说明'}</summary><p>来源：DEMO-03 合成案例；可获得时间 2026.${e[0]} 18:00。${e[1]==='事件更新'?'本记录为虚构事件说明，未接入真实原文。关联对象不重复计为独立事件。':'此记录为对象评估与纳管演示，不是事件热度计算。'}</p></details></div></li>`).join('')}</ol>`;}
function objectDetail(id,origin,fromSource){const ctx=contextOf(origin),o=objectAt(id,ctx);if(!o)return notFound();nav(origin!=='home');const back=fromSource?sourceURL(fromSource,origin):origin==='home'?'#overview':'#reports/'+origin;$('#main').innerHTML=`<a class="back" href="${back}">${arrow('left')}${fromSource?'返回风险源关联对象':origin==='home'?'返回风险速览':'返回当期报告'}</a><div class="pagehead"><div><h1>${o.name}</h1><p>${o.target} · ${o.scope}</p></div><div class="snapshot"><strong>2026.${cutoffs[ctx]} · 18:00 北京时间</strong>${ctx==='past'?'报告当期快照':'当前示例快照'} · ${o.tracking}</div></div>${ctx==='past'?'<p class="notice">历史阅读 · 变量、变化原因、观察重点和关联内容均截至 10.09。</p>':''}<div class="detail-layout v4-detail"><article class="panel content"><section class="judgment"><h2>${ctx==='past'?'当期判断':'当前判断'}</h2>${metrics(o)}<p class="detail-summary">${o.summary}</p><dl class="snapshot-facts"><div><dt>发展阶段</dt><dd>${o.card.stage}</dd></div><div><dt>持续条件</dt><dd>${o.card.persistence}</dd></div><div><dt>当前影响</dt><dd>${o.card.scope}</dd></div></dl></section><nav class="card-wayfinding" aria-label="卡片阅读位置"><button data-jump="core-variables">核心驱动变量</button><button data-jump="change-reason">变化原因</button><button data-jump="next-watch">下一步观察</button></nav>${variablesView(o)}${reasonView(o)}${watchView(o)}<details class="evolution-disclosure"><summary>对象演化脉络 <span class="muted">· ${o.events.length} 条记录</span></summary><p class="muted">事件提供证据，评估说明判断是否改变；同日记录按形成顺序由新到旧。</p>${timeline(o)}</details></article><aside><section class="panel content"><h2>历史位置</h2>${position(o,ctx==='past')}${chart(o,ctx==='past')}<details><summary>查看同口径历史数值</summary><p>${o.history.length?o.history.map((v,i)=>'10.'+String((ctx==='past'?2:9)+i).padStart(2,'0')+'：'+v+' 分').join('；'):'暂无历史；未评分不补零。'}</p></details></section><section class="panel content object-sources"><h2>关联风险源</h2>${sourcesOf(o,origin)}<p class="muted">来源关联帮助理解背景，不代表贡献权重。</p><details><summary>对象身份与范围</summary><p>稳定标识：MR-${o.id.toUpperCase()}<br>首次纳入：2026.${o.admitted}<br>观察目标：${o.target}<br>范围：${o.scope}<br>纳管状态：${o.tracking}</p><p>定义与范围变化时应重新核对历史可比性。</p></details></section></aside></div>${method()}${footer()}`;}

function sourceDetail(id,origin,fromObject){const ctx=contextOf(origin),s=getSignal(id,ctx);if(!s)return notFound();nav(origin!=='home');const related=objects.map(o=>objectAt(o.id,ctx)).filter(o=>o&&o.sources.includes(id));const back=fromObject?objectURL(fromObject,origin):origin==='home'?'#overview':'#reports/'+origin;$('#main').innerHTML=`<a class="back" href="${back}">${arrow('left')}${fromObject?'返回原观察对象':origin==='home'?'返回风险速览':'返回当期报告'}</a><div class="pagehead"><div><h1>${s.name}</h1><p>风险源背景 · 2026.${cutoffs[ctx]} 18:00${ctx==='past'?' · 历史快照':''}</p></div><span class="badge">来源视角</span></div><div class="detail-layout"><section class="panel content"><h2>来源判断</h2><p class="detail-summary">${s.summary}</p>${metrics(s)}<p>${s.meaning}</p><h2>关联的风险观察对象</h2><p class="muted">${related.length} 个去重对象 · 关联表示风险来源，不表示该来源独立造成损害。</p>${related.map(o=>`<a class="related-object" href="${objectURL(o.id,origin,id)}"><span><strong>${o.name}</strong><small>${o.target} · ${stateLabel(o)}</small></span>${arrow()}</a>`).join('')||'<p class="notice">此时点没有关联对象。没有关联记录不等于没有风险。</p>'}</section><aside class="panel content"><h2>来源历史</h2>${position(s,ctx==='past')}${chart(s,ctx==='past')}<p class="muted">来源分值不直接赋给对象，也不由对象简单平均得到。</p><details><summary>来源证据与限制</summary><p>${s.evidenceText}</p><p>DEMO-01 合成风险源示例 · 截至 ${s.status==='stale'?'10.14':cutoffs[ctx]}。对象另用 DEMO-03 合成案例，两层仅演示关联。</p></details></aside></div>${method()}${footer()}`;}
function reportsV4(key){if(!['week','archive'].includes(key))return notFound();nav(true);const ctx=contextOf(key),ids=key==='archive'?['ust','usd','energy']:['ust','energy','trade'];$('#main').innerHTML=`<div class="pagehead"><div><h1>观察报告</h1><p>沿着对象的变化，理解本期判断。</p></div><div class="periods"><a href="#reports/week" aria-current="${key==='week'}">10.16 本期</a><a href="#reports/archive" aria-current="${key==='archive'}">10.09 历史</a></div></div><article class="panel report v3-report"><h2>${ctx==='past'?'承接压力待确认，能源成本居高位':'承接压力增强，能源缓解仍需验证'}</h2><p class="report-meta">每周观察 · 截至 2026.${cutoffs[ctx]} 18:00 · 虚构示例</p><p class="report-lead">${ctx==='past'?'本期保留三项已纳管对象的当期判断；后续事件尚未进入证据链。':'同一来源下，具体对象的方向可能不同。先核查压力增强的对象，同时保留缓解信号与新纳入对象的证据缺口。'}</p><h3>本期对象</h3>${ids.map(id=>{let o=objectAt(id,ctx);return `<div class="report-row"><div><a href="${objectURL(id,key)}">${o.name}</a><br><small>${o.target} · 查看报告当期快照</small></div><div><span class="score">${num(o.score)}</span><br><small>${o.score==null?'暂未评分':level(o)}</small></div><div class="report-explanation"><p>${o.card.reason}</p><small><strong>下一步：</strong>${o.card.watch[0].title}</small></div></div>`}).join('')}<h3>下一期验证</h3><p>${ctx==='past'?'发行承接能否保持；融资成本是否继续上行；库存能否形成缓冲。':'拍卖承接与市场深度能否同步改善；能源库存缓冲能否延续；结算规则是否造成实际延迟。'}</p><details><summary>本期覆盖与口径</summary><p>报告以对象为单位，同一对象跨多个风险源仅列一次。本页引用固定当期对象快照，风险源关联也遵守相同截止时间。${ctx==='past'?'10.16 新纳入的结算对象不出现在此期。':'本期共 4 个对象，3 个可评分，1 个待评估。上方选列变化对象，不等于完整清单。'}</p></details></article>${method()}${footer()}`;}
function notFound(){nav(false);$('#main').innerHTML=`<section class="empty"><h1>没有找到这份快照</h1><p>该对象、关联或时间版本不可用。</p><a class="button-link" href="#overview">返回风险速览</a></section>${footer()}`;}
function routeV4(){let [page,id,origin='home',from,...rest]=location.hash.slice(1).split('/');const validOrigin=originValid(origin);if(!page||page==='overview')overview();else if(page==='reports')reportsV4(id||'week');else if(!rest.length&&validOrigin&&page==='object'&&(!from||objectAt(id,contextOf(origin))?.sources.includes(from)))objectDetail(id,origin,from);else if(!rest.length&&validOrigin&&page==='source'&&(!from||objectAt(from,contextOf(origin))?.sources.includes(id)))sourceDetail(id,origin,from);else notFound();window.scrollTo(0,!page||page==='overview'?homeScroll:0);$('#main').focus({preventScroll:true});document.title=($('#main h1')?.textContent||'RiskHot')+' · 量化信号决策辅助产品设计 V4';}
document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){const el=document.getElementById(jump.dataset.jump);el?.scrollIntoView({block:'start'});el?.focus({preventScroll:true});}const evidence=e.target.closest('[data-evidence]');if(evidence){const el=document.querySelector('[data-variable=\"'+evidence.dataset.evidence+'\"]');if(el){el.querySelector('details').open=true;el.scrollIntoView({block:'start'});el.focus({preventScroll:true});$('#announcement').textContent='已展开'+el.querySelector('h3').textContent+'依据';}}const b=e.target.closest('button');if(b?.dataset.object){selectedObject=b.dataset.object;homeScroll=scrollY;overview();document.querySelector(`[data-object="${selectedObject}"]`).focus({preventScroll:true});$('#announcement').textContent='已选择'+objectAt(selectedObject).name;if(matchMedia('(max-width:760px)').matches)$('#object-preview').scrollIntoView();}if(b&&'filter'in b.dataset){sourceFilter=b.dataset.filter;overview();document.querySelector(`[data-filter="${sourceFilter}"]`).focus({preventScroll:true});$('#announcement').textContent='已显示'+visibleObjects().length+'个关联对象';}if(b?.dataset.order){order=b.dataset.order;overview();document.querySelector(`[data-order="${order}"]`).focus({preventScroll:true});}if(e.target.closest('[data-list]')){e.preventDefault();$('#object-list').scrollIntoView();document.querySelector(`[data-object="${selectedObject}"]`)?.focus({preventScroll:true});}if(e.target.closest('a[href^="#"]')&&(!location.hash||location.hash==='#overview'))homeScroll=scrollY;});
window.addEventListener('hashchange',routeV4);routeV4();
</script></body></html>
