function objectAt(id,ctx='now'){const o=objects.find(x=>x.id===id);if(!o||!cutoffs[ctx]||!o.past&&ctx==='past')return null;const history=ctx==='past'?o.past:o.history;return {...o,history,score:history.at(-1)??null,previous:history.at(-2)??null,status:history.length?'current':'missing',summary:ctx==='past'?o.pastSummary:o.summary,events:o.events.filter(e=>e[0]<=cutoffs[ctx]),why:ctx==='past'?o.pastSummary:o.why};}
const originValid=x=>x==='home'||x==='week'||x==='archive';
const contextOf=origin=>origin==='archive'?'past':'now';
const objectURL=(id,origin='home',source='')=>`#object/${id}/${origin}${source?'/'+source:''}`;
const sourceURL=(id,origin='home',object='')=>`#source/${id}/${origin}${object?'/'+object:''}`;
let selectedObject='ust',sourceFilter='',order='priority',homeScroll=0;
function nav(report){document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===(report?'reports':'overview')?'page':'false'));}
function footer(){return `<footer class="footer"><span>RiskHot · 量化信号决策辅助产品设计 V3</span><span>虚构演示 · 数据与评估均为合成示例</span></footer>`;}
function method(){return `<details class="method"><summary>如何理解对象、分值与关联？</summary><p>对象围绕稳定风险问题、观察目标和范围建立，同一对象持续吸收事件。事件更新不必然改变评估；没有新事件也不等于风险稳定。“持续跟踪”是纳管状态，与压力程度分开。</p><p>0–100 为演示风险强度，不是发生概率。80 分为高压力演示分界。对象与风险源独立评估，不复制、不平均；排序以可比口径为前提，当前模型与阈值尚待校准。历史位置仅比较此前 7 期，不是长期分位。</p><p>同一对象可关联多个风险源，同一事件可支持多个对象；关联本身不证明因果。定义或范围变化导致不可比时，应中断历史比较。原型仅覆盖宏观对象，无需配置。</p></details>`;}
function sourcesOf(o,origin='home'){return `<div class="source-links">${o.sources.map(id=>`<a href="${sourceURL(id,origin,o.id)}">${signals.find(s=>s.id===id).name}${arrow()}</a>`).join('')}</div>`;}
function metrics(o){return `<div class="object-metrics"><strong class="${o.score>=80?'up':''}">${num(o.score)}<small> /100</small></strong><span class="${tone(diff(o))}">${stateLabel(o)}<small>较前一日 ${signed(diff(o))} 分</small></span></div>`;}
function preview(o){return `<div class="panelhead"><h2>对象解读</h2><span class="badge">${o.tracking}</span></div><div class="aside-body"><h2>${o.name}</h2><p class="muted">${o.target} · ${o.scope}</p>${metrics(o)}<p class="takeaway">${o.summary}</p>${position(o)}<h3>来自哪些风险源</h3>${sourcesOf(o)}<p class="muted">关联解释风险来源，不代表贡献权重。</p><a class="button-link" href="${objectURL(o.id)}">查看演化脉络与依据 ${arrow()}</a><a href="#object-list" class="back mobile-return" data-list>返回对象列表</a></div>`;}
function visibleObjects(){return objects.filter(o=>!sourceFilter||o.sources.includes(sourceFilter)).map(o=>objectAt(o.id)).sort((a,b)=>order==='recent'?b.admitted.localeCompare(a.admitted)||(b.score??-1)-(a.score??-1):(b.score??-1)-(a.score??-1));}
function overview(){nav(false);let list=visibleObjects();if(!list.some(o=>o.id===selectedObject))selectedObject=list[0]?.id;$('#main').innerHTML=`<div class="pagehead"><div><h1>风险速览</h1><p>看见具体压力，追溯判断如何形成。</p></div><div class="snapshot"><strong>2026.10.16 · 18:00 北京时间</strong>4 个风险观察对象 · 虚构演示</div></div><section class="important-changes"><div class="changes-head"><h2>本期重要变化</h2><span>相较 10.15 · 新纳入单列</span></div><div class="changes-list">${[['ust','压力增强','80 → 84 分 · 承接走弱'],['energy','出现缓解','80 → 77 分 · 库存回补'],['trade','新纳入观察','暂未评分 · 等待实际影响观测']].map(([id,label,copy])=>`<a class="change-item" href="${objectURL(id)}"><span class="${id==='ust'?'up':id==='energy'?'down':'muted'}">${label}</span><strong>${objects.find(o=>o.id===id).name}</strong><span class="muted">${copy}</span><span class="change-action">查看变化依据 ${arrow()}</span></a>`).join('')}</div></section><section class="source-background"><div><h2>风险源背景</h2><p>选择来源查看相关对象，或打开来源解读。</p></div><div class="source-filters"><button data-filter="" aria-pressed="${!sourceFilter}">全部对象</button>${signals.map(s=>`<div class="source-pair"><button data-filter="${s.id}" aria-pressed="${sourceFilter===s.id}">${s.name}<span>${objects.filter(o=>o.sources.includes(s.id)).length}</span></button><a href="${sourceURL(s.id)}" aria-label="查看${s.name}解读">${arrow()}</a></div>`).join('')}</div></section><div class="workspace"><section class="panel" id="object-list"><div class="panelhead"><div><h2>风险观察</h2><small>${list.length} 个对象${sourceFilter?' · '+signals.find(s=>s.id===sourceFilter).name:''}</small></div><div class="sorts"><button data-order="priority" aria-pressed="${order==='priority'}">风险优先</button><button data-order="recent" aria-pressed="${order==='recent'}">新纳入优先</button></div></div><div class="object-list">${list.map(o=>`<button class="object-row ${selectedObject===o.id?'selected':''}" data-object="${o.id}" aria-pressed="${selectedObject===o.id}" aria-controls="object-preview"><span><strong>${o.name}</strong><small>${o.target} · ${o.scope}</small><span class="row-reason">${o.why}</span></span><span class="object-state"><strong class="${o.score>=80?'up':''}">${num(o.score)}<small>/100</small></strong><span class="${tone(diff(o))}">${o.score==null?'新纳入 · 暂未评分':stateLabel(o)}</span></span></button>`).join('')||'<div class="content"><h3>暂无关联的观察对象</h3><p>来源没有关联对象，不等于不存在风险。可返回全部对象继续阅读。</p><button data-filter="">查看全部对象</button></div>'}</div><p class="table-note">每个对象只出现一次。未评分不以零分替代；风险优先时排在已评分对象之后。</p></section><aside class="panel aside" id="object-preview">${selectedObject?preview(objectAt(selectedObject)):'<div class="content"><h2>等待对象纳入</h2><p>暂不生成对象判断。</p></div>'}</aside></div>${method()}${footer()}`;}
function timeline(o){return `<ol class="timeline">${[...o.events].reverse().map(e=>`<li><div class="timeline-meta"><time>2026.${e[0]}</time><span class="badge ${e[1]==='评估更新'?'assessment':''}">${e[1]}</span></div><div><h3>${e[2]}</h3><p>${e[3]}</p><details><summary>查看${e[1]==='事件更新'?'事件依据':'记录说明'}</summary><p>来源：DEMO-03 合成案例；可获得时间 2026.${e[0]} 18:00。${e[1]==='事件更新'?'本记录为虚构事件说明，未接入真实原文。关联对象不重复计为独立事件。':'此记录为对象评估与纳管演示，不是事件热度计算。'}</p></details></div></li>`).join('')}</ol>`;}
function objectDetail(id,origin,fromSource){const ctx=contextOf(origin),o=objectAt(id,ctx);if(!o)return notFound();nav(origin!=='home');let back=fromSource?sourceURL(fromSource,origin):origin==='home'?'#overview':'#reports/'+origin;$('#main').innerHTML=`<a class="back" href="${back}">${arrow('left')}${fromSource?'返回风险源关联对象':origin==='home'?'返回风险速览':'返回当期报告'}</a><div class="pagehead"><div><h1>${o.name}</h1><p>${o.target} · ${o.scope}</p></div><div class="snapshot"><strong>2026.${cutoffs[ctx]} · 18:00 北京时间</strong>${ctx==='past'?'报告当期快照':'最新示例快照'} · ${o.tracking}</div></div>${ctx==='past'?'<p class="notice">历史阅读：本页及其风险源关联均截至 10.09，不混入后续事件与评估。</p>':''}<div class="detail-layout"><article class="panel content"><h2>当前判断</h2>${metrics(o)}<p class="detail-summary">${o.summary}</p>${o.why!==o.summary?`<p>${o.why}</p>`:""}<h2>对象演化脉络</h2><p class="muted">事件更新提供证据；评估更新说明判断是否改变。相同日期按记录顺序由新到旧展示。</p>${timeline(o)}<h2>判断需要验证什么</h2>${ctx==='past'?'<p>当期仅确认上述评估。需后续证据验证压力是否持续；原型未提供当期条件明细，不使用当前条件补齐。</p>':`<dl><div class="line-item"><dt>潜在影响</dt><dd>${o.impact}</dd></div><div class="line-item"><dt>强化条件</dt><dd>${o.confirm}</dd></div><div class="line-item"><dt>缓解条件</dt><dd>${o.relief}</dd></div><div class="line-item"><dt>反证限制</dt><dd>${o.counter}</dd></div></dl>`}</article><aside><section class="panel content"><h2>历史位置</h2>${position(o,ctx==='past')}${chart(o,ctx==='past')}<details><summary>查看同口径历史数值</summary><p>${o.history.length?o.history.map((v,i)=>`10.${String((ctx==='past'?2:9)+i).padStart(2,'0')}：${v} 分`).join('；'):'暂无历史；未评分不补零。'}</p></details></section><section class="panel content object-sources"><h2>关联风险源</h2>${sourcesOf(o,origin)}<p class="muted">对象分值与来源分值独立。点击可查看该来源下的其他对象。</p><details><summary>对象身份与范围</summary><p>稳定标识：MR-${o.id.toUpperCase()}<br>首次纳入：2026.${o.admitted}<br>观察目标：${o.target}<br>观察范围：${o.scope}<br>纳管状态：${o.tracking}</p><p>演示期间定义未变。范围变更需重新核对可比性，不能直接延续历史位置。</p></details></section></aside></div>${method()}${footer()}`;}
function sourceDetail(id,origin,fromObject){const ctx=contextOf(origin),s=getSignal(id,ctx);if(!s)return notFound();nav(origin!=='home');const related=objects.map(o=>objectAt(o.id,ctx)).filter(o=>o&&o.sources.includes(id));const back=fromObject?objectURL(fromObject,origin):origin==='home'?'#overview':'#reports/'+origin;$('#main').innerHTML=`<a class="back" href="${back}">${arrow('left')}${fromObject?'返回原观察对象':origin==='home'?'返回风险速览':'返回当期报告'}</a><div class="pagehead"><div><h1>${s.name}</h1><p>风险源背景 · 2026.${cutoffs[ctx]} 18:00${ctx==='past'?' · 历史快照':''}</p></div><span class="badge">来源视角</span></div><div class="detail-layout"><section class="panel content"><h2>来源判断</h2><p class="detail-summary">${s.summary}</p>${metrics(s)}<p>${s.meaning}</p><h2>关联的风险观察对象</h2><p class="muted">${related.length} 个去重对象 · 关联表示风险来源，不表示该来源独立造成损害。</p>${related.map(o=>`<a class="related-object" href="${objectURL(o.id,origin,id)}"><span><strong>${o.name}</strong><small>${o.target} · ${stateLabel(o)}</small></span>${arrow()}</a>`).join('')||'<p class="notice">此时点没有关联对象。没有关联记录不等于没有风险。</p>'}</section><aside class="panel content"><h2>来源历史</h2>${position(s,ctx==='past')}${chart(s,ctx==='past')}<p class="muted">来源分值不直接赋给对象，也不由对象简单平均得到。</p><details><summary>来源证据与限制</summary><p>${s.evidenceText}</p><p>DEMO-01 合成风险源示例 · 截至 ${s.status==='stale'?'10.14':cutoffs[ctx]}。对象另用 DEMO-03 合成案例，两层仅演示关联。</p></details></aside></div>${method()}${footer()}`;}
function reportsV3(key){if(!['week','archive'].includes(key))return notFound();nav(true);const ctx=contextOf(key),ids=key==='archive'?['ust','usd','energy']:['ust','energy','trade'];$('#main').innerHTML=`<div class="pagehead"><div><h1>观察报告</h1><p>沿着对象的变化，理解本期判断。</p></div><div class="periods"><a href="#reports/week" aria-current="${key==='week'}">10.16 本期</a><a href="#reports/archive" aria-current="${key==='archive'}">10.09 历史</a></div></div><article class="panel report v3-report"><h2>${ctx==='past'?'承接压力待确认，能源成本居高位':'承接压力增强，能源缓解仍需验证'}</h2><p class="report-meta">每周观察 · 截至 2026.${cutoffs[ctx]} 18:00 · 虚构示例</p><p class="report-lead">${ctx==='past'?'本期保留三项已纳管对象的当期判断；后续事件尚未进入证据链。':'同一来源下，具体对象的方向可能不同。先核查压力增强的对象，同时保留缓解信号与新纳入对象的证据缺口。'}</p><h3>本期对象</h3>${ids.map(id=>{let o=objectAt(id,ctx);return `<div class="report-row"><div><a href="${objectURL(id,key)}">${o.name}</a><br><small>${o.target} · 查看报告当期快照</small></div><div><span class="score">${num(o.score)}</span><br><small>${o.score==null?'暂未评分':level(o)}</small></div><p>${o.summary}</p></div>`}).join('')}<h3>下一期验证</h3><p>${ctx==='past'?'发行承接能否保持；融资成本是否继续上行；库存能否形成缓冲。':'拍卖承接与市场深度能否同步改善；能源库存缓冲能否延续；结算规则是否造成实际延迟。'}</p><details><summary>本期覆盖与口径</summary><p>报告以对象为单位，同一对象跨多个风险源仅列一次。本页引用固定当期对象快照，风险源关联也遵守相同截止时间。${ctx==='past'?'10.16 新纳入的结算对象不出现在此期。':'本期共 4 个对象，3 个可评分，1 个待评估。上方选列变化对象，不等于完整清单。'}</p></details></article>${method()}${footer()}`;}
function notFound(){nav(false);$('#main').innerHTML=`<section class="empty"><h1>没有找到这份快照</h1><p>该对象、关联或时间版本不可用。</p><a class="button-link" href="#overview">返回风险速览</a></section>${footer()}`;}
function routeV3(){let [page,id,origin='home',from,...rest]=location.hash.slice(1).split('/');const validOrigin=originValid(origin);if(!page||page==='overview')overview();else if(page==='reports')reportsV3(id||'week');else if(!rest.length&&validOrigin&&page==='object'&&(!from||objectAt(id,contextOf(origin))?.sources.includes(from)))objectDetail(id,origin,from);else if(!rest.length&&validOrigin&&page==='source'&&(!from||objectAt(from,contextOf(origin))?.sources.includes(id)))sourceDetail(id,origin,from);else notFound();window.scrollTo(0,!page||page==='overview'?homeScroll:0);$('#main').focus({preventScroll:true});document.title=($('#main h1')?.textContent||'RiskHot')+' · 量化信号决策辅助产品设计 V3';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.object){selectedObject=b.dataset.object;homeScroll=scrollY;overview();document.querySelector(`[data-object="${selectedObject}"]`).focus({preventScroll:true});$('#announcement').textContent='已选择'+objectAt(selectedObject).name;if(matchMedia('(max-width:760px)').matches)$('#object-preview').scrollIntoView();}if(b&&'filter'in b.dataset){sourceFilter=b.dataset.filter;overview();document.querySelector(`[data-filter="${sourceFilter}"]`).focus({preventScroll:true});$('#announcement').textContent='已显示'+visibleObjects().length+'个关联对象';}if(b?.dataset.order){order=b.dataset.order;overview();document.querySelector(`[data-order="${order}"]`).focus({preventScroll:true});}if(e.target.closest('[data-list]')){e.preventDefault();$('#object-list').scrollIntoView();document.querySelector(`[data-object="${selectedObject}"]`)?.focus({preventScroll:true});}if(e.target.closest('a[href^="#"]')&&(!location.hash||location.hash==='#overview'))homeScroll=scrollY;});
window.addEventListener('hashchange',routeV3);routeV3();
</script></body></html>
