function comparePanel(r){const first=state.baseline==='first',base=first?r.first:r.base,summary=first?r.firstSummary:r.baselineSummary,t=first?r.firstTrend:r.trend,reason=first?r.firstReason:r.reason;return `<div class="section-head border"><h2>当前状态与历史变化</h2>${r.base?`<div class="segmented" aria-label="历史比较基准"><button class="segment ${!first?'active':''}" data-action="baseline" data-base="previous" aria-pressed="${!first}">较上一轮</button><button class="segment ${first?'active':''}" data-action="baseline" data-base="first" aria-pressed="${first}">较首次观察</button></div>`:tag('无历史基准','unknown')}</div><div class="reading-block"><div class="compare"><div class="compare-box"><div class="caption"><span>${first?'首次观察':'比较基准'}</span><span>${base?base.slice(5,10).replace('-','.'): '—'}</span></div>${base?`<p>${esc(summary)}</p><div class="status-row" style="margin:0 0 9px">${severity(first?r.hist[0][1]:r.hist[Math.max(0,r.hist.length-2)][1])}</div><div class="small muted">${base} · 北京时间</div>`:'<p>这是首轮观察，尚无可比历史快照。</p><div class="small muted">不默认填入“稳定”。</div>'}</div><div class="compare-mid">${icon('arrow')}</div><div class="compare-box current"><div class="caption"><span>本轮状态</span>${severity(r.level)}</div><p>${esc(r.summary)}</p><div class="small muted">${r.snapshot} · 北京时间</div></div></div><div class="analysis-block"><div class="row">${tag('变化分析示例','ai')}${trend(t)}</div><p>${esc(reason)}</p><div class="compare-meta">${r.base?'当前与基准分别锁定，读取对应的演示分析记录。':'首次观察缺少可比基准，方向保留待判断。'}</div></div></div>`}
function renderRiskOverview(r){return `<div class="detail-grid"><div class="stack"><section class="surface" id="compare-panel">${comparePanel(r)}</section><section class="surface"><div class="reading-block"><h2>当前风险，拆开看</h2><div class="fact-grid"><div class="fact-cell"><h3>当前阶段</h3><p>${esc(r.stage)} · ${r.level==='待判断'?'证据不足，保留判断':'阶段名称为原型演示口径'}</p></div><div class="fact-cell"><h3>当前影响范围</h3><p>${esc(r.scope)}</p></div><div class="fact-cell"><h3>持续性判断</h3><p>${esc(r.duration)}</p></div><div class="fact-cell"><h3>持续条件</h3><p>${esc(r.durationText)}</p></div></div></div><div class="reading-block"><h2>压力端与缓释端</h2><div class="forces"><div class="force"><h3><i class="dot" style="color:var(--danger)"></i>风险压力</h3><p>${esc(r.reason)}</p></div><div class="force"><h3><i class="dot" style="color:var(--down)"></i>缓释与相反证据</h3><p>${esc(r.counter)}</p></div></div><div class="note-line">${icon('info')}<span>按机制解释两端作用，不把指标数量或报道数量换算为力量百分比。</span></div></div></section></div><aside class="stack">${nextPanel(r)}${evidencePanel(r)}<section class="surface quiet-panel"><h3>追溯到本轮快照</h3><p class="mono">${r.snapshotId}</p><button class="btn quiet" style="font-size:12px;min-height:29px;margin-top:7px" data-action="pinned" data-id="${r.id}">查看引用信息 →</button></section></aside></div>`}
function renderEvolution(r){return `<div class="detail-grid"><section class="surface"><div class="section-head border"><div><h2>每一次判断，保留当时的依据</h2><p>按观察顺序呈现；趋势读取对应分析结果。</p></div><span class="small muted">${r.hist.length} 轮观察</span></div><div class="timeline">${[...r.hist].reverse().map(([date,level,t,desc],idx)=>`<article class="timeline-item ${idx===0?'current':''}"><div class="timeline-title"><strong>${date.replace('-','.')} · ${idx===0?'本轮快照':'历史快照'}</strong>${severity(level)}${trend(t)}</div><p>${desc}</p><div class="timeline-rationale">${idx===0?esc(r.next):t==='待判断'?'无比较基准，不形成历史变化结论。':'此处保留该轮结论；更新不会无痕覆盖历史。'}</div><button class="btn" data-action="history" data-id="${r.id}" data-date="${date}">查看该轮记录 ${icon('chevron')}</button></article>`).join('')}</div></section><aside class="stack">${nextPanel(r)}<section class="surface quiet-panel"><h3>减弱信号与转折确认分开</h3><p>${r.trend==='减弱'?'本轮已出现减弱信号；是否形成持续的减弱节点仍需后续证据验证。':'本轮尚未展示经验证的减弱节点。界面保留观察条件，不补造转折确认。'}</p></section><section class="surface quiet-panel"><h3>变化不会被等级档位遮住</h3><p>连续两轮均为“高”，可以同时对应“风险增强”。时间线并列呈现程度、方向及解释。</p></section></aside></div>`}
function renderDrivers(r){return `<div class="detail-grid"><div class="stack">${r.variables.length?r.variables.map(id=>{const v=V(id),i=v.risks.indexOf(r.id);return `<section class="surface variable-card"><div class="variable-top"><h2>${v.name}</h2>${tag(v.state)}</div><span class="small muted mono">${v.code} · 变量状态与作用分开呈现</span><div class="definition-box"><span class="small muted">在此风险中的作用</span><p style="margin-top:5px;color:var(--ink)">${esc(v.effects[i])}</p></div>${riskIndicatorTable(v,r)}<p>${esc(v.description)}</p><div class="card-bottom"><span class="small muted">指标事实 → 变量状态 → 风险机制</span><button class="btn quiet" data-action="variable" data-id="${id}" data-risk="${r.id}">看证据 ${icon('arrow')}</button></div></section>`}).join(''):`<section class="surface"><div class="empty"><h3>历史变量明细未纳入演示</h3><p>本原型保留该风险的历史状态，不补造变量证据。</p></div></section>`}</div><aside class="stack">${evidencePanel(r)}<section class="surface quiet-panel"><h3>核心驱动变量与指标分工</h3><p>变量表达需要理解的风险机制；指标提供观测依据。指标数值的变化，需要经过机制分析才能形成风险方向。</p><a class="btn quiet" href="#variables">进入变量观察 →</a></section></aside></div>`}
function renderRiskMapping(r){return `<div class="banner">${icon('network')}<span>规划能力。当前风险状态与证据来自现有 L1/L2 设计；资产传导、市场定价、情绪及风险态度分析需要新增上游能力与规则。</span></div><section class="surface"><div class="reading-block"><h2>从这项风险出发，探索条件性传导</h2><p class="muted" style="font-size:13px;line-height:1.9">围绕“${esc(r.name)}”，后续页面应先展示传导机制，再区分已观测市场反应与待验证的资产情景。</p><div class="chain"><div class="chain-node"><div class="overline">风险状态</div><strong>${esc(r.name)}</strong><p>${esc(r.level)} · ${esc(r.trend)}</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="overline">作用机制</div><strong>${r.variables.length?esc(V(r.variables[0]).name):'待补齐机制证据'}</strong><p>明确方向、范围及成立条件</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="overline">资产映射</div><strong>条件性影响与观察线索</strong><p>价格反应、反证与失效条件</p></div></div><a class="btn primary" href="#mapping">查看市场映射规划原型 ${icon('arrow')}</a></div></section>`}
function variableCard(v){return `<section class="surface variable-card"><div class="variable-top"><h2><button class="risk-title" style="font-size:16px" data-action="variable" data-id="${v.id}">${v.name}</button></h2>${tag(v.state)}</div><div class="small muted">${v.domain} · ${v.risks.length} 项风险关联</div><p>${esc(v.description)}</p><div class="mini-data-wrap"><table class="mini-data"><thead><tr><th>核心观测指标（虚构）</th><th>本轮</th></tr></thead><tbody>${v.indicators.map(row=>`<tr><td>${row[0]}</td><td><strong>${row[3]}</strong> ${row[4]}</td></tr>`).join('')}</tbody></table></div><div class="card-bottom"><span class="small muted">同一变量，分别解释各风险作用</span><button class="btn quiet" data-action="variable" data-id="${v.id}">展开 ${icon('arrow')}</button></div></section>`}
function renderVariables(){return `${pageHead('变量观察','从核心驱动变量出发，理解同一变化如何作用于不同风险。')}<div class="banner neutral">${icon('sliders')}<span>阅读层展示已有变量定义与本轮分析。全局变量维护、指标口径及映射治理留在 M2；本页不提供修改定义或重新评级操作。</span></div><div class="toolbar" style="padding:0 0 18px"><label class="input-wrap" style="max-width:440px">${icon('search')}<input id="variable-query" aria-label="搜索变量或观测指标" value="${esc(state.variableQuery)}" placeholder="搜索核心驱动变量、领域或观测指标"></label><span class="small muted">示例观测轮次：03.08 / 03.11 / 03.14</span></div><div class="variable-list" id="variable-results">${variableRows()}</div>`}
function variableRows(){const q=state.variableQuery.trim().toLowerCase();const rows=VARIABLES.filter(v=>(v.name+v.domain+v.indicators.map(i=>i[0]).join('')).toLowerCase().includes(q));return rows.length?rows.map(variableCard).join(''):`<div class="surface empty" style="grid-column:1/-1"><h3>没有匹配的变量</h3><p>可以尝试变量名称或指标名称。</p></div>`}

function renderMapping(){const a=assetConfig[state.asset];return `${pageHead('市场映射','把风险变化、市场反应与条件性机会放在同一研究框架中。')}<div class="banner">${icon('network')}<span><strong>规划能力 · 全部为虚构研究情景。</strong> 此区域超出现行 L3 已确认能力。上线前需补齐资产传导、市场定价、情绪与风险态度的分析契约；不输出交易指令或目标价格。</span></div><div class="mapping-layout"><aside class="surface asset-nav" aria-label="资产类别">${Object.entries(assetConfig).map(([key,c])=>`<button class="asset-btn ${key===state.asset?'active':''}" data-action="asset" data-asset="${key}" aria-pressed="${key===state.asset}">${icon(key==='credit'?'shield':key==='rates'?'sliders':key==='equities'?'layers':'network')} ${c.name}</button>`).join('')}</aside><div class="stack"><section class="surface mapping-overview"><div class="status-row" style="margin:0 0 10px">${tag('资产观察')}${tag('条件性解释','plan')}</div><h2>${a.name}：${a.pressure}</h2><p>先明确风险如何传导，再讨论定价是否已经反映。</p><div class="chain"><div class="chain-node"><div class="overline">01 / 风险变化</div><a class="risk-title" href="#risk/${a.risk}/overview" style="font-size:13px">${R(a.risk).name}</a><p>${R(a.risk).level} · ${R(a.risk).trend}</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="overline">02 / 传导机制假设</div><strong>${a.driver}</strong><p>${a.mechanism}</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="overline">03 / 条件性资产影响</div><strong>${a.name}定价与风险补偿</strong><p>保留正反方向与成立条件</p></div></div><div class="definition-box" style="margin-bottom:0"><strong style="font-size:12px">市场反应 · 与风险状态分别观测</strong><p style="font-size:13px">${a.reaction}</p></div></section><section class="surface reading-block"><h2>两类周期，分别回答两个问题</h2><div class="cycle-grid"><div class="cycle"><div class="cycle-head"><strong>情绪周期</strong>${tag(a.emotion,'new')}</div><span class="small muted">投资者此刻如何感受市场？</span>${a.emotion==='待判断'?'<div class="definition-box small">缺少观测，不显示位置。</div>':`<div class="spectrum" style="--pos:${state.asset==='credit'?'28%':state.asset==='rates'?'50%':'73%'}" aria-label="定性位置示意，非量化指数"></div><div class="spectrum-labels"><span>恐惧</span><span>中性</span><span>贪婪</span></div>`}<p>${a.emotionEvidence}</p></div><div class="cycle"><div class="cycle-head"><strong>风险态度周期</strong>${tag(a.attitude)}</div><span class="small muted">参与者愿意承担多少风险？</span>${a.attitude==='待判断'?'<div class="definition-box small">缺少行为证据，不显示位置。</div>':`<div class="spectrum" style="--pos:${state.asset==='rates'?'32%':'70%'}" aria-label="定性位置示意，非量化指数"></div><div class="spectrum-labels"><span>厌恶高</span><span>中性</span><span>容忍高</span></div>`}<p>${a.attitudeEvidence}</p></div></div><div class="note-line">${icon('info')}<span>位置仅用于定性界面评审，未建立量化指数。正式观测应分别记录主体、市场、时间窗口与来源；情绪极端本身不构成机会确认。</span></div></section><section class="surface reading-block"><div class="scenario"><div><div class="scenario-title">${tag('待验证线索','plan')}<h2>${a.opportunity}</h2></div><p>将“风险变化”与“市场已有定价”对照，保留成立条件、反证与失效路径。风险减弱也可能已被价格充分反映。</p><div class="condition"><strong>成立条件</strong><p>${a.condition}</p></div><div class="condition invalid"><strong>失效条件</strong><p>${a.invalid}</p></div></div><aside class="observation"><h2>继续观察</h2><p>${a.verify}</p><button class="btn" style="margin-top:14px;background:#fff" data-action="mapping-evidence" data-asset="${state.asset}">查看规划证据要求 ${icon('arrow')}</button></aside></div></section></div></div>`}

function reportRows(){return evaluated().filter(r=>r.snapshot.slice(0,10)>=reportInfo[state.report].start)}
function reportRisk(r){return `<div class="report-risk"><div class="heading">${selectRiskLink(r)}${severity(r.level)}${trend(r.trend)}</div><p>${r.reason}</p><button class="report-ref" data-action="pinned" data-id="${r.id}" aria-label="查看${r.name}的报告引用快照">引用快照：${r.snapshotId} ${icon('link')}</button></div>`}
function renderReports(){const info=reportInfo[state.report],rows=reportRows();return `${pageHead('周期报告','把一个周期内的重要变化，整理成可回溯的阅读结果。')}<div class="report-layout"><aside class="surface report-nav"><div class="segmented" aria-label="报告周期">${[['day','日报'],['week','周报'],['month','月报']].map(([key,label])=>`<button class="segment ${state.report===key?'active':''}" data-action="report-period" data-period="${key}" aria-pressed="${state.report===key}">${label}</button>`).join('')}</div><div class="report-card active">${tag('发布态示例')}<strong>${info.name}</strong><small>${info.period}</small><small style="margin-top:8px">版本 v1.0 · 引用 ${rows.length} 项风险</small></div><p class="small muted">仅提供一份当前周期样例。导出为 Markdown；已发布状态与版本用于展示交互，未执行后台发布。</p></aside><article class="surface report-paper"><div class="report-kicker"><span>RiskHot / 风险观察</span>${tag('虚构演示数据','new')}</div><h2>${info.name}</h2><div class="report-period">报告周期：${info.period} · 北京时间</div><div class="small muted" style="margin-top:6px">数据截止：2025.03.14 18:00　生成：18:10　发布：18:15（均为演示）</div><div class="report-abstract"><strong>本期观察</strong><p style="margin-top:7px">融资压力仍在积累，需求端出现边际缓和。风险程度与变化方向保持分开，${rows.filter(r=>r.trend==='待判断').length} 项首次观察风险保留待判断，后续继续核对驱动变量与缓释证据。</p></div><div class="report-section"><h3>01　压力增强</h3>${rows.filter(r=>r.trend==='增强').map(reportRisk).join('')||'<p class="small muted">本期无符合口径的增强条目。</p>'}</div><div class="report-section"><h3>02　风险减弱与持续验证</h3>${rows.filter(r=>r.trend==='减弱').map(reportRisk).join('')||'<p class="small muted">本期无符合口径的减弱条目。</p>'}</div><div class="report-section"><h3>03　保持稳定 / 尚待判断</h3>${rows.filter(r=>!['增强','减弱'].includes(r.trend)).map(reportRisk).join('')}</div><div class="report-section"><h3>04　下一轮观察</h3><p class="small" style="line-height:1.9">${R('r1').next}<br>${R('r3').next}</p></div><div class="source-block"><strong>本原型报告口径</strong>截面时点跟踪中、周期内有有效评估的风险，每项引用最新快照及适用的历史比较基准。栏目和纳入规则用于产品讨论，正式规则仍待确认。月报示例覆盖月内截至本轮的时间，未冒充完整月度报告。<br><span class="mono">${info.id} / v1.0</span></div></article></div>`}
function openDialog(title,html,drawer=false){const d=$('#dialog');if(!d.open)dialogTrigger=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;d.classList.toggle('drawer',drawer);hydrateIcons(d);if(!d.open)d.showModal();d.scrollTop=0;const autofocus=d.querySelector('[autofocus]');if(autofocus)autofocus.focus()}
function closeDialog(){const d=$('#dialog');if(d.open)d.close()}
$('#dialog').addEventListener('close',()=>{if(dialogTrigger&&dialogTrigger.isConnected)dialogTrigger.focus()});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeDialog()}});
function showVariable(id,riskId){const v=V(id);if(!v)return;const r=R(riskId);openDialog(v.name,`${tag('变量阅读视图')}${tag('虚构演示','new')}<div class="mono muted" style="margin:10px 0">${v.code}</div><p>${v.definition}</p>${r?`<div class="definition-box"><span class="small muted">当前风险上下文 · ${r.name}</span><p style="margin-top:7px">${v.effects[v.risks.indexOf(r.id)]||'关联机制待补充'}</p><div class="small muted" style="margin-top:7px">此处不将变量上行直接解释为风险增强。</div></div>`:''}<div class="dialog-section"><h3>观测事实 · 虚构数据</h3>${variableObservationTable(v,r)}<p class="small muted" style="margin-top:10px">演示观测于各标注日期 08:00 可用。本视图截止：${r?r.snapshot||'尚无有效快照':DATA.cutoff}（北京时间）。仅展示截止时点已可用的演示记录。</p></div><div class="dialog-section"><h3>变量状态 → 风险作用</h3>${tag(v.state)}<p style="margin-top:10px">${v.description}</p>${v.risks.map((rid,i)=>`<div class="risk-link-row"><div><a href="#risk/${rid}/drivers" data-action="dialog-nav" class="risk-title" style="font-size:13px">${R(rid).name}</a><p>${v.effects[i]}</p></div>${tag(R(rid).snapshot?'关联风险':'待评估',R(rid).snapshot?'':'unknown')}</div>`).join('')}</div><div class="dialog-section"><h3>相反证据与数据缺口</h3><div class="source-block"><strong>相反证据</strong>${v.counter}</div><div class="source-block"><strong>数据缺口</strong>${v.gap}</div></div><div class="source-block"><strong>演示来源及追溯要求</strong>${v.sources.join('；')}。这些来源名称均为虚构占位，不对应真实机构。<br>生产数据应保留来源标识、原文定位、数据观察期、发布时间、修订版本与证据截止时间。</div>`,true)}
function showEvidence(id){const r=R(id);if(!r)return;openDialog('证据与判断依据',`<div class="small muted">${r.code} · ${r.name}</div><div class="status-row">${tag('虚构演示数据','new')}${tag('事实 / 分析分层')}</div><div class="dialog-section"><h3>01　观测事实</h3>${r.variables.length?r.variables.map(vid=>{const v=V(vid);return `<div class="source-block"><strong>${v.name}</strong>${evidenceObservations(v,r)}<br><span class="small muted">来源：${v.sources.join('；')} · 虚构示例</span></div>`}).join(''):'<p class="muted">本原型未包含该历史风险的逐项观测证据。</p>'}</div><div class="dialog-section"><h3>02　分析解释</h3><div class="analysis-block" style="margin-top:0">${tag('分析示例','ai')}<p style="margin-top:9px">${r.reason}</p></div></div><div class="dialog-section"><h3>03　反证与缺口</h3><div class="source-block"><strong>相反证据</strong>${r.counter}</div><div class="source-block"><strong>尚缺什么</strong>${r.gap}</div></div><div class="dialog-section"><h3>04　继续验证</h3><p>${r.next}</p></div><div class="source-block"><strong>引用快照</strong><span class="mono">${r.snapshotId||'尚无有效快照'}</span><br>评估截止：${stamp(r)}<br>比较基准：${r.base||'无'}<br>本抽屉展示的是虚构观测；真实上线需接入被对应快照锁定的证据，不以最新数据覆盖历史。</div>`,true)}
function showPinned(id){const r=R(id);if(!r)return;openDialog('引用快照',`<div class="status-row">${tag('固定引用')}${tag('虚构演示','new')}</div><div class="dialog-section"><h3>${r.name}</h3><div class="source-block"><strong>风险身份</strong><span class="mono">${r.code}</span></div><div class="source-block"><strong>本轮快照</strong><span class="mono">${r.snapshotId||'无有效快照'}</span><br>评估截止：${stamp(r)}</div><div class="source-block"><strong>比较基准快照</strong><span class="mono">${r.comparisonId||'无可比历史基准'}</span><br>信息截止：${r.base||'—'}</div><div class="definition-box">${severity(r.level)} ${trend(r.trend)}<p style="margin-top:10px">${r.summary}</p></div><p class="muted small">报告条目回到其引用的快照。更新后的风险主页可以独立展示最新状态，已引用结论不得被无痕替换。本原型没有后台版本变更。</p></div>`,true)}
function showHistory(id,date){const r=R(id),h=r?.hist.find(x=>x[0]===date);if(!h)return;const idx=r.hist.indexOf(h);openDialog('历史观察记录',`<div class="small muted">${r.name} · 2025.${date.replace('-','.')}</div><div class="status-row">${severity(h[1])}${trend(h[2])}${tag('虚构历史快照')}</div><div class="definition-box"><strong>该轮判断</strong><p style="margin-top:10px">${h[3]}</p></div><div class="source-block"><strong>该轮比较基准</strong>${idx>0?'2025.'+r.hist[idx-1][0].replace('-','.'):'首次观察，无历史基准'}<br>严重程度与趋势分别保留；历史内容不随新一轮判断覆盖。</div><div class="source-block"><strong>演示覆盖边界</strong>${idx===r.hist.length-1?'此处为最后一轮快照，可回到“变量与证据”查看演示明细。':'本原型为该历史轮次提供状态与变化摘要。逐项证据尚未纳入演示，不引用当前数据冒充当时证据。'}</div>`,true)}
function showPhilosophy(){openDialog('产品理念与原型说明',`<div class="status-row">${tag('产品方案 v1.0')}${tag('本地交互原型')}</div><div class="definition-box" style="font-size:17px;font-weight:500">从风险的变化出发，用变量解释，用证据校验，用条件理解机会。</div><p>RiskHot 的核心阅读对象是一项持续观察的风险。首页帮助分配注意力，详情保存判断过程，变量连接事实与机制，映射保留成立条件。</p>${[
 ['变化优先','首页优先展示风险变化及其原因。严重程度与变化方向并列，避免高等级遮住新增压力。'],
 ['结论可展开，未知可保留','按“结论 → 核心驱动变量 → 指标 / 事件证据”逐层阅读。同时保留反证、缺口与下一轮观察条件。'],
 ['围绕同一对象持续研究','从发现、跟踪到理解，都在同一风险身份下完成。阅读者无需频繁跨模块寻找同一对象。'],
 ['机会保持条件性','风险变化、市场定价、情绪周期和风险态度分别建模。机会线索同时展示成立条件与失效条件。'],
 ['读取与治理分层','关注收藏仅保存本机偏好；不会改变正式风险纳管与跟踪状态。参数治理与评估发布由后台负责。']
 ].map(([t,p],i)=>`<div class="philosophy-row"><span class="num">0${i+1}</span><div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}<div class="dialog-section"><h3>当前可体验</h3><p>关注清单搜索与筛选、严重程度排序、本机关注、风险详情、已提供基准间的切换、演化记录、变量证据抽屉、档案状态筛选、规划资产切换、日周月报告与 Markdown 导出。</p></div><div class="dialog-section"><h3>范围与限制</h3><p>全部数据与机构样例均为虚构。未连接真实项目、行情、LLM 或数据库；不会修改项目文件。资产映射为规划交互，尚缺上游正式分析能力；报告规则与若干评级、阶段、时效口径仍待确认。月报样例为月内截至本轮版本。</p></div><div class="source-block"><strong>项目依据（通过 RiskHot Knowledge 读取）</strong>《业务架构总览》§4.3–4.4；《RiskHot L3 风险产品与发布层：业务架构与领域设计》§1.4–1.6；共用 DESIGN.md V2.2。<br>视觉沿用深绿导航、暖灰画布与白色工作面。产品层导航与页面组织为本次建议，未改动管理中心现有架构。</div><div class="source-block"><strong>本机数据</strong>关注标记${localAvailable?'保存在当前浏览器本地存储':'仅保留在当前页面会话'}。不含账号、密钥或远程请求。<button class="btn quiet" style="display:block;font-size:12px" data-action="reset-demo">恢复演示关注标记</button></div>`,false)}
function showMappingEvidence(asset){const a=assetConfig[asset];openDialog('映射上线前的证据要求',`<p>${a.name} · 规划契约。以下为需要补齐的分析输入，尚未在现行产品层中作为已实现能力提供。</p>${[['风险事实','引用 riskId、snapshotId 与适用的 comparisonSnapshotId；保留严重程度、方向、证据和时间。'],['传导机制','明确变量、受影响主体、传导环节、条件、正反方向及证据引用；不直接换算涨跌概率。'],['市场定价','按市场与资产保留价格、利差、估值或其他适用观测，记录观察期、可比口径和数据版本。'],['情绪与风险态度','分别记录心理感受与承担风险的行为证据；明确样本主体、时间窗口、来源与覆盖限制。'],['条件性线索','给出可验证命题、成立条件、反证、失效条件和下一轮观测；不凭单一极端情绪确认机会。']].map(([t,p])=>`<div class="source-block"><strong>${t}</strong>${p}</div>`).join('')}`,true)}
function openSearch(){openDialog('搜索风险与变量',`<label class="search-large">${icon('search')}<input id="global-search" autofocus placeholder="输入风险、变量或稳定编码" aria-label="全局搜索风险和变量"></label><div id="search-results">${searchResults('')}</div><p class="small muted" style="margin-top:15px">搜索范围仅限本原型的 8 项风险和 5 项变量。</p>`)}
function searchResults(q){q=q.trim().toLowerCase();const rs=RISKS.filter(r=>(r.name+r.code+r.category+r.variables.map(id=>V(id).name).join('')).toLowerCase().includes(q));const vs=VARIABLES.filter(v=>(v.name+v.code+v.domain+v.indicators.map(i=>i[0]).join('')).toLowerCase().includes(q));if(!rs.length&&!vs.length)return '<div class="empty"><h3>没有匹配结果</h3><p>请尝试更短的名称或编码。</p></div>';return `<div class="small muted">风险 ${rs.length} · 变量 ${vs.length}</div>${rs.slice(0,q?8:4).map(r=>`<div class="search-result"><a href="#risk/${r.id}/overview" data-action="dialog-nav"><span>${r.name}</span><small>${r.code} · ${r.tracking}</small></a>${trend(r.trend)}</div>`).join('')}${vs.slice(0,q?5:2).map(v=>`<div class="search-result"><button data-action="variable" data-id="${v.id}">${v.name}<small>${v.code}</small></button>${tag('变量')}</div>`).join('')}`}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function saveFavorites(){try{localStorage.setItem('riskhot-favorites-v1',JSON.stringify(favorites))}catch(e){localAvailable=false}}
function toggleFavorite(id){if(!R(id))return;const added=!favorites.includes(id);favorites=added?[...favorites,id]:favorites.filter(x=>x!==id);saveFavorites();document.querySelectorAll(`[data-action="favorite"][data-id="${id}"]`).forEach(el=>{el.classList.toggle('saved',added);el.setAttribute('aria-pressed',String(added));el.setAttribute('aria-label',(added?'取消':'加入')+'本机关注：'+R(id).name)});if(state.view==='home'&&state.mine)updateHomeResults();toast((added?'已加入':'已取消')+'本机关注；正式跟踪状态保持不变')}
function closeMobile(){$('#sidebar').classList.remove('open');$('#mobile-backdrop').classList.remove('open')}
function exportReport(){const info=reportInfo[state.report],rows=reportRows();const text=`# RiskHot ${info.name}\n\n> 全部内容为虚构演示，非实时研究结论。\n\n报告 ID：${info.id}\n版本：v1.0\n报告周期：${info.period}\n数据截止：2025-03-14 18:00（北京时间）\n生成：2025-03-14 18:10（演示）\n发布：2025-03-14 18:15（发布态演示，未执行后台发布）\n\n## 本期观察\n融资压力仍在积累，需求端出现边际缓和。风险程度与变化方向分别保留。\n\n${rows.map(r=>`## ${r.name}\n\n严重程度：${r.level}；变化方向：${r.trend}\n\n${r.reason}\n\n相反证据：${r.counter}\n数据缺口：${r.gap}\n下一轮观察：${r.next}\n\n风险引用：${r.code}\n本轮快照：${r.snapshotId}\n快照截止：${r.snapshot}\n基准快照：${r.comparisonId||'无可比历史基准'}\n基准截止：${r.base||'无'}\n`).join('\n')}\n## 口径说明\n本原型采用“截面时点跟踪中、周期内有有效评估的风险，每项引用最新快照”。正式纳入规则与栏目仍待确认。月报样例覆盖月内截至本轮的区间，不代表完整月度报告。\n`;
const blob=new Blob(['\ufeff',text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`RiskHot_${state.report}_demo_20250314.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前周期报告及其快照引用')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='favorite')toggleFavorite(el.dataset.id);
 else if(a==='philosophy')showPhilosophy();
 else if(a==='search')openSearch();
 else if(a==='dialog-close')closeDialog();
 else if(a==='variable')showVariable(el.dataset.id,el.dataset.risk);
 else if(a==='evidence')showEvidence(el.dataset.id);
 else if(a==='pinned')showPinned(el.dataset.id);
 else if(a==='history')showHistory(el.dataset.id,el.dataset.date);
 else if(a==='dialog-nav')closeDialog();
 else if(a==='home-filter'){state.filter=el.dataset.filter;if(state.view!=='home')location.hash='#home';else updateHomeResults()}
 else if(a==='reset-filters'){state.filter='all';state.category='all';state.query='';state.mine=false;state.archiveStatus='all';state.archiveQuery='';render()}
 else if(a==='baseline'){state.baseline=el.dataset.base;$('#compare-panel').innerHTML=comparePanel(R(state.riskId))}
 else if(a==='asset'){state.asset=el.dataset.asset;render()}
 else if(a==='report-period'){state.report=el.dataset.period;render()}
 else if(a==='mapping-evidence')showMappingEvidence(el.dataset.asset);
 else if(a==='export-report')exportReport();
 else if(a==='back'){location.hash=state.origin||'#home'}
 else if(a==='mobile-open'){$('#sidebar').classList.add('open');$('#mobile-backdrop').classList.add('open')}
 else if(a==='mobile-close')closeMobile();
 else if(a==='reset-demo'){favorites=['r1','r3'];saveFavorites();closeDialog();render();toast('已恢复演示关注标记')}
});
document.addEventListener('input',e=>{if(e.target.id==='risk-query'){state.query=e.target.value;updateHomeResults()}else if(e.target.id==='global-search'){$('#search-results').innerHTML=searchResults(e.target.value)}else if(e.target.id==='archive-query'){state.archiveQuery=e.target.value;archiveUpdate()}else if(e.target.id==='variable-query'){state.variableQuery=e.target.value;$('#variable-results').innerHTML=variableRows()}});
document.addEventListener('change',e=>{if(e.target.id==='risk-category'){state.category=e.target.value;updateHomeResults()}else if(e.target.id==='risk-sort'){state.sort=e.target.value;updateHomeResults()}else if(e.target.id==='mine-only'){state.mine=e.target.checked;updateHomeResults()}else if(e.target.id==='archive-status'){state.archiveStatus=e.target.value;archiveUpdate()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeMobile()}});
window.addEventListener('hashchange',()=>{closeDialog();route()});hydrateIcons();route();
</script>
</body></html>
