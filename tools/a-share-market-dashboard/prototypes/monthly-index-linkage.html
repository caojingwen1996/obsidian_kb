<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月度日历与指数走势 · 交互设计预览</title>
<style>
:root{--ink:#18232c;--muted:#53616c;--line:#dfe5e9;--blue:#2464bf;--pale:#eaf1fb;--loss:#126a53;--gain:#a62c24}*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:var(--ink);font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}::selection{background:#cbdcf5}main{max-width:1440px;margin:32px auto;padding:0 24px}.preview{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;color:var(--muted);font-size:12px}.panel{background:white;border-radius:14px;padding:28px 32px}.toolbar,.yearline,.chart-head,.summary,.legend{display:flex;align-items:center;justify-content:space-between;gap:16px}.toolbar{padding-bottom:20px;border-bottom:1px solid var(--line)}button,select{font:inherit;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);min-height:44px;padding:8px 14px;cursor:pointer}button:focus-visible,select:focus-visible,svg:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}button:disabled{color:#687580;background:#f3f5f6;cursor:not-allowed}.tabs{display:flex;gap:6px}.tabs button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}.mode{color:var(--muted);font-size:12px}.mode b{color:var(--blue);margin-left:12px}.yearline{padding:20px 0 16px}.yearline label{display:flex;align-items:center;gap:12px}.yearline p{margin:0;color:var(--muted);font-size:12px}.yearline strong{font-size:20px;margin-left:12px}.months{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.month{position:relative;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:14px 16px;min-height:100px;background:transparent}.month[aria-pressed=true]{background:var(--pale);outline:2px solid var(--blue);outline-offset:-2px}.month span{font-size:13px;font-weight:600}.month strong{display:block;font-size:20px;margin:4px 0}.month small{font-size:12px;color:var(--muted)}.month[aria-pressed=true] small{color:var(--blue)}.gain{color:var(--gain)}.loss{color:var(--loss)}.help{font-size:12px;color:var(--muted);margin:14px 0 26px}.chart-section{border-top:1px solid var(--line);padding-top:24px;scroll-margin-top:16px}h2{font-size:17px;margin:0 0 4px}.chart-head p{font-size:12px;color:var(--muted);margin:0}.summary{justify-content:flex-start;align-items:baseline;flex-wrap:wrap;gap:10px 28px;padding:16px 0;margin-top:8px;min-height:62px}.summary b{font-size:14px}.summary span{font-size:12px;color:var(--muted)}.summary strong{font-size:14px;margin-left:8px}.legend{justify-content:flex-end;gap:20px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:20px;height:2px;background:#7b8da1}.legend .selected{background:var(--blue);height:3px}.plot{position:relative;width:100%;height:310px}svg{width:100%;height:100%;display:block;touch-action:pan-y}.readout{min-height:27px;text-align:right;color:var(--muted);font-size:12px}.note{font-size:12px;line-height:1.8;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-bottom:0}.empty{color:var(--muted)}
@media(max-width:700px){main{margin:16px auto;padding:0 12px}.preview{display:block}.preview span{display:block}.panel{padding:20px 16px}.toolbar{gap:8px}.mode{display:none}.yearline{flex-wrap:wrap;gap:10px}.yearline p{width:100%}.months{grid-template-columns:repeat(2,1fr)}.month{padding:12px}.chart-head{align-items:flex-start}.chart-head button{padding:8px 10px;white-space:nowrap}.summary{gap:8px 16px}.summary b{width:100%}.plot{height:270px}.legend{justify-content:flex-start;margin-bottom:8px}.tabs button{font-size:13px}.help{margin-bottom:22px}}
.calendar-chart-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:32px;align-items:start}.calendar-column,.chart-section{min-width:0}.chart-section{border-top:0;border-left:1px solid var(--line);padding:0 0 0 28px}.chart-head{align-items:flex-start}.chart-head button{white-space:nowrap}.chart-head p{max-width:46ch}.summary{min-height:86px;gap:8px 20px;align-content:center}.summary b{flex-basis:100%}.help{margin-bottom:0}.note{margin-top:24px}.plot{height:290px}
@media(max-width:1000px){.calendar-chart-row{grid-template-columns:1fr;gap:24px}.chart-section{border-left:0;border-top:1px solid var(--line);padding:24px 0 0}.months{grid-template-columns:repeat(4,1fr)}.summary{min-height:86px}}
@media(max-width:700px){.months{grid-template-columns:repeat(2,1fr)}.plot{height:270px}}
</style>
<main><div class="preview"><span>温度计 / 年度收益与历史统计</span><span>交互设计预览 · 曲线及数值均为演示数据，非真实行情</span></div><section class="panel"><div class="toolbar"><div class="tabs" aria-label="月历指标"><button data-metric="return" aria-pressed="true">月度收益</button><button data-metric="drawdown" aria-pressed="false">月度回撤</button></div><span class="mode">收益日历 <b>月</b></span></div><div class="yearline"><label>年份 <select id="year"><option>2026</option><option>2025</option></select></label><p>所选年份累计收益 <strong id="year-return"></strong></p></div><div class="calendar-chart-row"><div class="calendar-column"><div class="months" aria-label="选择月份以高亮指数走势"></div><p class="help">点击月份查看它在全年走势中的位置；再次点击可取消高亮。</p></div><section class="chart-section"><div class="chart-head"><div><h2>纳斯达克100指数走势</h2><p id="range"></p></div><button id="clear" disabled>取消高亮</button></div><div class="summary" aria-live="polite"></div><div class="legend"><span><i></i>全年走势</span><span><i class="selected"></i>所选月份</span></div><div class="plot"><svg role="img" aria-label="所选年份指数日收盘走势" tabindex="0"></svg></div><div class="readout">移至折线查看日期与指数点位</div></section></div><p class="note">纵轴：指数点位（非零起点） · 横轴：交易日期。选中月份仅强调对应区间，坐标范围保持不变。月收益沿用月末相对上月末口径，首个统计月以首个可用交易日为基准；月度回撤在当月重新起算。</p></section></main>
<script>
const $=s=>document.querySelector(s);let selected=null,metric='return',points=[],months=[],bounds;
const iso=t=>new Date(t).toISOString().slice(0,10);const pct=v=>(v>0?'+':'')+v.toFixed(2)+'%';const cls=v=>v>0?'gain':v<0?'loss':'';
function makeData(){const year=Number($('#year').value);points=[];const first=Date.UTC(year,0,2),last=year===2026?Date.UTC(year,10,3):Date.UTC(year,11,31);for(let t=first;t<=last;t+=86400000){const day=new Date(t).getUTCDay();if(day===0||day===6)continue;const d=(t-first)/86400000;const close=22000+14*d-2700*Math.exp(-(((d-100)/27)**2))+420*Math.sin(d*.12)+180*Math.sin(d*.81);points.push({t,close,month:new Date(t).getUTCMonth()});}months=Array.from({length:12},(_,m)=>{const p=points.filter(p=>p.month===m);if(!p.length)return null;const index=points.indexOf(p[0]),base=points[Math.max(0,index-1)].close;let peak=p[0].close,dd=0;for(const v of p){peak=Math.max(peak,v.close);dd=Math.min(dd,(v.close/peak-1)*100);}return{p,ret:(p.at(-1).close/base-1)*100,dd};});selected=null;render();}
function render(){const year=$('#year').value;const ret=(points.at(-1).close/points[0].close-1)*100;$('#year-return').textContent=pct(ret);$('#year-return').className=cls(ret);$('.months').innerHTML=months.map((m,i)=>`<button class="month" data-month="${i}" aria-pressed="${selected===i}" ${m?'':'disabled'} aria-controls="trend"><span>${i+1}月</span><strong class="${m?cls(metric==='return'?m.ret:m.dd):''}">${m?pct(metric==='return'?m.ret:m.dd):'—'}</strong><small>${!m?'未开始':selected===i?'已高亮':year==='2026'&&i===10?'月内累计':'已统计'}</small></button>`).join('');$('#range').textContent=`${year}年 · ${iso(points[0].t)} 至 ${iso(points.at(-1).t)} · 日收盘点位`;$('#clear').disabled=selected===null;const m=months[selected];$('.summary').innerHTML=m?`<b>${selected+1}月已高亮</b><span>${iso(m.p[0].t)} — ${iso(m.p.at(-1).t)}</span><span>月度收益<strong class="${cls(m.ret)}">${pct(m.ret)}</strong></span><span>月度最大回撤<strong class="loss">${pct(m.dd)}</strong></span>`:'<b>全年走势</b><span>选择月份，高亮相应的价格区间</span>';draw();}
function draw(){const svg=$('svg');svg.id='trend';const width=$('.plot').clientWidth,height=$('.plot').clientHeight,left=58,right=16,top=28,bottom=34;const low=Math.floor(Math.min(...points.map(p=>p.close))/1000)*1000,high=Math.ceil(Math.max(...points.map(p=>p.close))/1000)*1000;const start=points[0].t,end=points.at(-1).t;const x=t=>left+(t-start)/(end-start)*(width-left-right),y=v=>top+(high-v)/(high-low)*(height-top-bottom);bounds={x,y,left,width,start,end};svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const path=arr=>arr.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(2)},${y(p.close).toFixed(2)}`).join(' ');let html='<title>指数日收盘走势，设计演示数据</title>';if(selected!==null){const year=Number($('#year').value),a=Math.max(start,Date.UTC(year,selected,1)),b=Math.min(end,Date.UTC(year,selected+1,1));html+=`<rect x="${x(a)}" y="${top}" width="${Math.max(0,x(b)-x(a))}" height="${height-top-bottom}" fill="#eaf1fb"/>`;}
for(let i=0;i<5;i++){const v=low+(high-low)*i/4;html+=`<line x1="${left}" x2="${width-right}" y1="${y(v)}" y2="${y(v)}" stroke="#e5eaee"/><text x="${left-10}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#53616c">${Math.round(v).toLocaleString()}</text>`;}
months.forEach((m,i)=>{if(!m||width<500&&i%2===1)return;html+=`<text x="${x(m.p[0].t)}" y="${height-10}" text-anchor="middle" font-size="12" fill="${selected===i?'#2464bf':'#53616c'}">${i+1}月</text>`;});html+=`<path d="${path(points)}" fill="none" stroke="${selected===null?'#2464bf':'#7b8da1'}" stroke-width="${selected===null?1.8:1.4}" stroke-linejoin="round"/>`;if(selected!==null){const p=months[selected].p;html+=`<path class="highlight-line" d="${path(p)}" fill="none" stroke="#2464bf" stroke-width="3" stroke-linejoin="round"/>`;for(const v of [p[0],p.at(-1)])html+=`<circle cx="${x(v.t)}" cy="${y(v.close)}" r="3.5" fill="#2464bf" stroke="white" stroke-width="1.5"/>`;}
svg.innerHTML=html+'<g id="cursor" visibility="hidden"><line stroke="#637b96" stroke-dasharray="3 3"/><circle r="4" fill="#2464bf" stroke="white" stroke-width="2"/></g>';}
function selectMonth(m,scroll=true){selected=selected===m?null:m;render();if(scroll&&innerWidth<=1000)$('.chart-section').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});else $(`[data-month="${m}"]`).focus({preventScroll:true});}
$('.months').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b&&!b.disabled)selectMonth(Number(b.dataset.month));});$('#clear').onclick=()=>{selected=null;render();$('svg').focus({preventScroll:true});};$('#year').onchange=makeData;document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;document.querySelectorAll('[data-metric]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.metric===metric));render();});let hover=0;
function inspect(i){hover=Math.max(0,Math.min(points.length-1,i));const p=points[hover],g=$('#cursor'),{x,y}=bounds;g.setAttribute('visibility','visible');g.querySelector('line').setAttribute('x1',x(p.t));g.querySelector('line').setAttribute('x2',x(p.t));g.querySelector('line').setAttribute('y1',28);g.querySelector('line').setAttribute('y2',$('.plot').clientHeight-34);g.querySelector('circle').setAttribute('cx',x(p.t));g.querySelector('circle').setAttribute('cy',y(p.close));$('.readout').textContent=`${iso(p.t)} · 收盘 ${p.close.toLocaleString('zh-CN',{maximumFractionDigits:2})} 点`;}
$('svg').onpointermove=e=>{const rect=$('svg').getBoundingClientRect(),t=bounds.start+(e.clientX-rect.left-bounds.left)/(bounds.width-bounds.left-16)*(bounds.end-bounds.start);let i=0;for(let j=1;j<points.length;j++)if(Math.abs(points[j].t-t)<Math.abs(points[i].t-t))i=j;inspect(i);};$('svg').onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();inspect(hover+(e.key==='ArrowLeft'?-1:1));}};new ResizeObserver(draw).observe($('.plot'));makeData();
</script></html>
